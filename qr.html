<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Munich Kart — play it</title>
<style>
  html, body { height: 100%; margin: 0; background: #0066B3; color: #fff; font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; text-align: center; }
  h1 { font-size: 64px; margin: 0; letter-spacing: -1px; }
  p  { font-size: 28px; margin: 0; opacity: .9; }
  img { width: min(56vh, 520px); height: auto; background: #fff; padding: 18px; border-radius: 16px; }
  .url { font-size: 34px; font-weight: 700; background: rgba(255,255,255,.14); padding: 12px 24px; border-radius: 12px; }
  .hint { font-size: 20px; opacity: .75; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Munich Kart</h1>
  <p>Built live, shipped live. Scan and race.</p>
  <img src="qr.png" alt="QR code to the live game">
  <div class="url">zartis-digital.github.io/munich-kart</div>
  <div class="hint">Phone: on-screen Left / Right / Boost · Laptop: arrow keys, Shift to drift</div>
</div>
</body>
</html>
